    <!-- Preload hint makes the browser fetch the font CSS at high priority
         immediately (earlier than a script-injected link). The script below
         then activates it as a stylesheet — avoiding inline event handlers
         (script-src-attr: 'none' CSP) while still being non-render-blocking.
         No integrity attribute on preload/stylesheet hints — SRI only applies
         to cross-origin subresource fetches, not metadata link hints. -->
    <link rel="preload" as="style"
          href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
    <script>
      (function() {
        var l = document.createElement('link');
        l.rel = 'stylesheet';
        l.href = 'https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap';
        document.head.appendChild(l);
      })();
    </script>
