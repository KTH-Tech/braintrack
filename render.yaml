# Render.com infrastructure definition — BrainTrack
# Docs: https://render.com/docs/blueprint-spec
#
# Required environment variables (set in Render dashboard, not here):
#   DATABASE_URL           — Supabase pooled connection string (port 6543)
#   SESSION_SECRET         — cryptographically random string (32+ chars)
#   CRON_SECRET            — secret shared between cron jobs and the API
#   OPENAI_API_KEY         — OpenAI API key
#   RESEND_API_KEY         — Resend email API key (or SENDGRID_API_KEY)
#   SUPABASE_URL           — https://<project>.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY — Supabase service-role key (never expose to client)
#   VAPID_PUBLIC_KEY       — Web Push VAPID public key
#   VAPID_PRIVATE_KEY      — Web Push VAPID private key
#   VAPID_SUBJECT          — mailto:learn@kth-tech.com
#   ADMIN_EMAILS           — comma-separated admin email allowlist
#   APP_URL                — https://app.braintrack.co.za (no trailing slash)
#   NODE_ENV               — production

services:
  # ── Main Web Service ────────────────────────────────────────────────────────
  - type: web
    name: braintrack-api
    runtime: node
    region: frankfurt  # closest to South Africa; change to 'ohio' if latency differs
    plan: standard     # upgrade to 'pro' at 63+ schools
    buildCommand: npm install && npm run build
    # Applies additive-only, idempotent pending migrations (0033, 0035) against
    # the live DB AFTER build and BEFORE traffic cutover. The runtime has no
    # migrate step, so without this the new code would read columns the DB
    # doesn't have and 500 (the 0034-class regression). If it fails, the deploy
    # aborts and the old version keeps serving. Safe to run repeatedly — every
    # migration it touches is IF NOT EXISTS. See script/predeploy-migrate.ts.
    preDeployCommand: npx tsx script/predeploy-migrate.ts
    # The build emits dist/index.cjs (see script/build.ts) — starting
    # dist/index.js crashes the service on boot with MODULE_NOT_FOUND.
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5000"
    autoDeploy: true
    scaling:
      minInstances: 1
      maxInstances: 3
      targetMemoryPercent: 80
      targetCPUPercent: 70

  # ── DBE content ingestion (manual trigger) ─────────────────────────────────
  # A cron scheduled far in the future so it never self-runs — trigger it by
  # hand from the Render dashboard ("Run job") when you want to ingest or
  # re-ingest DBE papers. Runs on Linux with a real OPENAI_API_KEY, which is
  # where the OCR fallback for scanned PDFs (Maths, technical subjects) works.
  # Content de-dupes on content_hash, so re-runs are safe.
  - type: cron
    name: braintrack-dbe-ingestion
    runtime: node
    region: frankfurt
    schedule: "0 3 29 2 *"  # 29 Feb — effectively manual-only
    buildCommand: npm install
    startCommand: npx tsx server/scripts/ingest-all.ts
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ENABLE_OCR_FALLBACK
        value: "1"
      - key: NODE_OPTIONS
        value: "--max-old-space-size=4096"
      - key: SESSION_SECRET
        sync: false

  # ── Cron: Streak Reminders — runs daily at 17:00 SAST (15:00 UTC) ──────────
  - type: cron
    name: braintrack-streak-reminders
    runtime: node
    region: frankfurt
    schedule: "0 15 * * *"
    buildCommand: echo "skip build"
    startCommand: >
      curl -sf -X POST
      -H "Authorization: Bearer $CRON_SECRET"
      -H "Content-Type: application/json"
      "${APP_URL}/api/push/send-streak-reminders"
      | node -e "process.stdin.resume(); process.stdin.on('data', d => console.log(d.toString()));"
    envVars:
      - key: APP_URL
        sync: false
      - key: CRON_SECRET
        sync: false

  # ── Cron: Daily Focus Push — runs daily at 06:00 SAST (04:00 UTC) ─────────
  - type: cron
    name: braintrack-daily-focus
    runtime: node
    region: frankfurt
    schedule: "0 4 * * *"
    buildCommand: echo "skip build"
    startCommand: >
      curl -sf -X POST
      -H "Authorization: Bearer $CRON_SECRET"
      -H "Content-Type: application/json"
      "${APP_URL}/api/push/send-daily-focus"
      | node -e "process.stdin.resume(); process.stdin.on('data', d => console.log(d.toString()));"
    envVars:
      - key: APP_URL
        sync: false
      - key: CRON_SECRET
        sync: false

  # ── Cron: Trial Expiry Reminders — runs daily at 08:00 SAST (06:00 UTC) ───
  - type: cron
    name: braintrack-trial-reminders
    runtime: node
    region: frankfurt
    schedule: "0 6 * * *"
    buildCommand: echo "skip build"
    startCommand: >
      curl -sf -X POST
      -H "Authorization: Bearer $CRON_SECRET"
      -H "Content-Type: application/json"
      "${APP_URL}/api/push/send-trial-reminders"
      | node -e "process.stdin.resume(); process.stdin.on('data', d => console.log(d.toString()));"
    envVars:
      - key: APP_URL
        sync: false
      - key: CRON_SECRET
        sync: false

  # ── Cron: Day-14 Trial Autocharge — runs daily at 05:00 UTC (07:00 SAST) ──
  # Charges expired trials (consent + card captured via Paystack) R169 and
  # moves them onto the recurring Paystack plan. Idempotent server-side.
  - type: cron
    name: braintrack-charge-trials
    runtime: node
    region: frankfurt
    schedule: "0 5 * * *"
    buildCommand: echo "skip build"
    startCommand: >
      curl -sf -X POST
      -H "Authorization: Bearer $CRON_SECRET"
      -H "Content-Type: application/json"
      "${APP_URL}/api/cron/charge-trials"
      | node -e "process.stdin.resume(); process.stdin.on('data', d => console.log(d.toString()));"
    envVars:
      - key: APP_URL
        sync: false
      - key: CRON_SECRET
        sync: false

  # ── Cron: SMS Retries — runs every hour ────────────────────────────────────
  - type: cron
    name: braintrack-sms-retries
    runtime: node
    region: frankfurt
    schedule: "0 * * * *"
    buildCommand: echo "skip build"
    startCommand: >
      curl -sf -X POST
      -H "Authorization: Bearer $CRON_SECRET"
      -H "Content-Type: application/json"
      "${APP_URL}/api/push/send-sms-retries"
      | node -e "process.stdin.resume(); process.stdin.on('data', d => console.log(d.toString()));"
    envVars:
      - key: APP_URL
        sync: false
      - key: CRON_SECRET
        sync: false

  # ── Cron: Anonymised Cohort Aggregation — runs daily at 02:00 UTC ───────────
  # Rolls per-learner attempt data up into the de-identified cohort_performance
  # table (k-anonymity K>=10 enforced in server/cohort-analytics.ts). No learner
  # identifiers are persisted. Idempotent — upserts each bucket in place.
  - type: cron
    name: braintrack-aggregate-cohort
    runtime: node
    region: frankfurt
    schedule: "0 2 * * *"
    buildCommand: echo "skip build"
    startCommand: >
      curl -sf -X POST
      -H "Authorization: Bearer $CRON_SECRET"
      -H "Content-Type: application/json"
      "${APP_URL}/api/cron/aggregate-cohort"
      | node -e "process.stdin.resume(); process.stdin.on('data', d => console.log(d.toString()));"
    envVars:
      - key: APP_URL
        sync: false
      - key: CRON_SECRET
        sync: false
